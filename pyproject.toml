[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video-get-api"
version = "0.1.0"
description = "Local-first media download API for Video Get"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
video-get-api = "video_get.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["services/downloader-api/src/video_get"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["services/downloader-api/tests"]
pythonpath = ["services/downloader-api/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["video_get"]
mypy_path = "services/downloader-api/src"

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true
